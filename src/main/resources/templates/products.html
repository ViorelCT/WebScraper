<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
<div class="container mt-5">
    <h1 class="mb-4">Products</h1>

    <form action="/upload-pdf"
          method="post"
          enctype="multipart/form-data"
          class="mb-4">

        <div class="row">
            <div class="col-md-6">
                <input type="file"
                       name="file"
                       class="form-control"
                       accept="application/pdf"
                       required>
            </div>
            <div class="col-md-2">
                <button class="btn btn-success">
                    Upload PDF
                </button>
            </div>
        </div>
    </form>

    <form method="get"
          action="/"
          class="row mb-4">

        <div class="col-md-4">
            <input type="text"
                   name="keyword"
                   class="form-control"
                   placeholder="Search product...">
        </div>

        <div class="col-md-3">
            <select name="sort"
                    class="form-select">
                <option value="">
                    Sort by
                </option>
                <option value="low to high">
                    Price low to high
                </option>
                <option value="high to low">
                    Price high to low
                </option>
            </select>
        </div>

        <div class="col-md-2">
            <button class="btn btn-primary">
                Apply
            </button>
        </div>
    </form>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Exchange Rate</th>
            <th>Price RON</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>

        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td>
                <img th:src="${product.imageUrl}"
                     width="100">
            </td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.exchangeRate}"></td>
            <td th:text="${product.priceRon}"></td>
            <td th:text="${product.description}"></td>
            <td>
                <a class="btn btn-primary btn-sm"
                   th:href="@{'/edit/' + ${product.id}}">
                    Edit
                </a>
                <form th:action="@{'/delete/' + ${product.id}}"
                      method="post"
                      style="display:inline;">
                    <button class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
